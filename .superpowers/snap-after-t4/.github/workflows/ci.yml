name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12
          cache: npm

      # No install scripts: build and tests do not need them (esbuild's postinstall is optional).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Built-package checks: CJS/ESM core identity, no legacy runtime in root, /paypal and
      # /subscription, node10 + node16 consumer type-check (real tsc), pure-core entry.
      - name: Package smoke tests
        run: npx vitest run test/dist-package-surface.test.ts test/dist-entry-identity.test.ts test/entries-consumer.test.ts test/subscription-entry-consumer.test.ts

      - name: Lint
        run: npm run lint

      - name: Pack dry-run
        run: npm pack --dry-run
