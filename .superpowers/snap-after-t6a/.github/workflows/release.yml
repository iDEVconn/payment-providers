name: Release

# On push to main, changesets/action either opens/refreshes a Version Packages PR
# (when pending .changeset/*.md files exist) or publishes when the version bump
# is already merged and no changesets remain.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Package smoke tests
        run: npx vitest run test/dist-package-surface.test.ts test/dist-entry-identity.test.ts test/entries-consumer.test.ts test/subscription-entry-consumer.test.ts

      - name: Lint
        run: npm run lint

      - name: Pack dry-run
        run: npm pack --dry-run

  # Only this job can write to the repo and mint the OIDC token for npm trusted publishing.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # setup-node writes a project .npmrc expecting NODE_AUTH_TOKEN; remove it so
      # changeset publish can use npm OIDC trusted publishing instead.
      - name: Clean npm auth config for OIDC publish
        run: |
          npm config delete always-auth --location=user 2>/dev/null || true
          npm config delete always-auth --location=project 2>/dev/null || true
          rm -f .npmrc

      - name: Install pinned npm for OIDC trusted publishing
        run: npm install -g npm@11.21.1

      - name: Create Release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npx changeset publish
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push any git tags created by changeset publish
        run: git push origin --tags

      - name: Create GitHub Release for tag on HEAD when missing
        run: |
          TAG=$(git describe --tags --abbrev=0 --exact-match 2>/dev/null || true)
          if [ -n "$TAG" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
